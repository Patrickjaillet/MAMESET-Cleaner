[package]
name = "mameset_cleaner"
version = "0.1.0"
edition = "2021"
description = "Logiciel de nettoyage et d'organisation de sets de ROMs MAME"
license = "MIT"
authors = ["Patrick JAILLET <sandefjord.development@proton.me>"]

[dependencies]
slint = "1.8"
quick-xml = "0.36"
ini = "1.3"
crc32fast = "1.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2.2"
sevenz-rust = "0.6"
ureq = "2.10"

[lib]
name = "mameset_cleaner"
path = "src/lib.rs"

[[bin]]
name = "mameset_cleaner"
path = "src/main.rs"

[[test]]
name = "structure_test"
path = "test/structure_test.rs"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
