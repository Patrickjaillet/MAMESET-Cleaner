[package]
name = "mameset_cleaner"
version = "1.7.0"
edition = "2021"
description = "Logiciel de nettoyage et d'organisation de sets de ROMs MAME"
license = "MIT"
authors = ["Patrick JAILLET <sandefjord.development@proton.me>"]

[dependencies]
plugin_interface = { path = "crates/plugin_interface" }
slint = "1.8"
quick-xml = "0.36"
configparser = "3.1"
crc32fast = "1.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2.2"
sevenz-rust = "0.6"
ureq = "2.10"
rfd = "0.15"
trash = "5.2"
abi_stable = "0.11.3"
libloading = "0.9.0"
sha2 = "0.10"

[lib]
name = "mameset_cleaner"
path = "src/lib.rs"

[[bin]]
name = "mameset_cleaner"
path = "src/main.rs"

[[test]]
name = "structure_test"
path = "test/structure_test.rs"

