    "crates/sms_plugin",
    "crates/genesis_plugin",
    "crates/game_gear_plugin",
    "crates/sega_cd_plugin",
    "crates/saturn_plugin",
    "crates/dreamcast_plugin",
    "crates/psx_plugin",
    "crates/ps2_plugin",
    "crates/psp_plugin",
    "crates/neo_geo_plugin",
